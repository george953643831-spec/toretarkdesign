<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="angOcclusion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#1A1A1D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="angSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121214" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2A2B30" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="angBottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="12%" stop-color="#22242A"/>
      <stop offset="28%" stop-color="#555864"/>
      <stop offset="36%" stop-color="#9EA4B5"/>
      <stop offset="44%" stop-color="#3D404A"/>
      <stop offset="70%" stop-color="#151619"/>
      <stop offset="92%" stop-color="#3A3E48"/>
      <stop offset="100%" stop-color="#18191D"/>
    </linearGradient>
    <linearGradient id="angGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFB600"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- Ground Shadow -->
  <ellipse cx="500" cy="860" rx="180" ry="36" fill="url(#angSoft)"/>
  <ellipse cx="500" cy="863" rx="110" ry="16" fill="url(#angOcclusion)"/>

  <!-- Bottle Group Centered -->
  <g transform="translate(370, 140)">
    <!-- Trigger Sprayer (Turned exactly 18 degrees) -->
    <g transform="translate(30, 0)">
      <path d="M40,55 L8,55 L4,72 L40,70 Z" fill="#25262B" stroke="#444752" stroke-width="1"/>
      <ellipse cx="6" cy="63" rx="3" ry="8" fill="#151619" stroke="#FFB600" stroke-width="1"/>
      <path d="M38,42 C38,42 65,30 115,30 C165,30 185,48 185,75 C185,100 160,118 135,120 L135,138 L85,138 L85,116 C65,116 48,102 42,88 Z" fill="#1C1D22" stroke="#383B44" stroke-width="1"/>
      <path d="M52,90 C50,110 58,150 78,175 C82,180 88,175 85,168 C72,145 68,115 68,90 Z" fill="#2B2D35" stroke="#4B4E5A" stroke-width="1"/>
      <rect x="75" y="138" width="70" height="24" rx="3" fill="#2A2C34" stroke="#454854" stroke-width="1"/>
    </g>

    <!-- Bottle Body (105mm No-distortion Straight Vertical) -->
    <path d="M102,162 L118,162 C118,185 125,205 145,218 L168,235 C190,250 205,275 205,305 L205,700 C205,710 195,716 185,716 L35,716 C25,716 15,710 15,700 L15,305 C15,275 30,250 52,235 L75,218 C95,205 102,185 102,162 Z" fill="url(#angBottleBody)" stroke="#383B45" stroke-width="1.2"/>

    <!-- Key Highlight Strip -->
    <path d="M72,255 L72,705" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Label Wrap -->
    <g transform="translate(18, 330)">
      <rect width="184" height="330" rx="4" fill="#14161A" stroke="#2D303A" stroke-width="1"/>
      <rect x="0" y="18" width="184" height="8" fill="url(#angGold)"/>

      <g transform="translate(92, 60)" text-anchor="middle">
        <circle cx="0" cy="0" r="18" fill="#181A20" stroke="#FFB600" stroke-width="1.5"/>
        <text y="6" fill="#FFB600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900">T</text>
        <text y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="3">TURTLE</text>
      </g>

      <text x="92" y="145" text-anchor="middle" fill="#FFB600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" letter-spacing="2">TIRE</text>
      <text x="92" y="178" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" letter-spacing="2">SHINE</text>

      <rect x="22" y="205" width="140" height="20" rx="3" fill="#1E2027" stroke="#363945" stroke-width="0.8"/>
      <text x="92" y="219" text-anchor="middle" fill="#A0A5B5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">GRAPHENE + ACRYLIC</text>

      <text x="92" y="255" text-anchor="middle" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600">DEEP RICH BLACK SHINE</text>
      <text x="92" y="272" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="500">PREVENTS BROWNING &amp; SLING</text>

      <line x1="25" y1="294" x2="159" y2="294" stroke="#FFB600" stroke-width="1" stroke-opacity="0.6"/>
      <text x="92" y="314" text-anchor="middle" fill="#E5E7EB" font-family="monospace" font-size="10.5" font-weight="700">16 FL. OZ. (473 mL)</text>
    </g>
  </g>
</svg>
