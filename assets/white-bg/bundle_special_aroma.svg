<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="aromaShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#1A1A1D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aromaCylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16171B"/>
      <stop offset="25%" stop-color="#282A32"/>
      <stop offset="50%" stop-color="#555866"/>
      <stop offset="65%" stop-color="#8E93A4"/>
      <stop offset="85%" stop-color="#32343E"/>
      <stop offset="100%" stop-color="#18191D"/>
    </linearGradient>
    <linearGradient id="aromaRingGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- Ground Shadows -->
  <!-- Box Shadow -->
  <ellipse cx="280" cy="800" rx="140" ry="30" fill="url(#aromaShadow)"/>
  <!-- Diffuser Shadow -->
  <ellipse cx="500" cy="820" rx="160" ry="34" fill="url(#aromaShadow)"/>
  <!-- Oil Bottle Shadow -->
  <ellipse cx="760" cy="815" rx="90" ry="20" fill="url(#aromaShadow)"/>

  <!-- ================= 1. PACKAGING BOX (REAR LEFT) ================= -->
  <g transform="translate(140, 360)">
    <!-- Top Face -->
    <polygon points="120,0 250,28 150,70 20,42" fill="#2D303A" stroke="#4A4E5B"/>
    <!-- Front Face -->
    <polygon points="20,42 150,70 150,440 20,412" fill="#18191E"/>
    <!-- Side Face -->
    <polygon points="150,70 250,28 250,398 150,440" fill="#0F1013"/>

    <polygon points="20,90 150,118 150,132 20,104" fill="url(#aromaRingGlow)"/>
    <text x="35" y="165" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="900" transform="skewY(12)">SMART AI AROMA</text>
    <text x="35" y="215" fill="#00F0FF" font-family="sans-serif" font-size="24" font-weight="900" transform="skewY(12)">ULTRASONIC</text>
    <text x="35" y="245" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="900" transform="skewY(12)">DIFFUSER PRO</text>
    <text x="35" y="290" fill="#9CA3AF" font-family="sans-serif" font-size="11" transform="skewY(12)">AUTOMATIC START/STOP</text>
  </g>

  <!-- ================= 2. SMART AROMA MACHINE (CENTER - 20 DEG TOP-VIEW PERSPECTIVE) ================= -->
  <g transform="translate(350, 420)">
    <!-- Cylinder Body (20° down angle) -->
    <path d="M20,110 L280,110 L280,360 C280,400 20,400 20,360 Z" fill="url(#aromaCylinderGrad)" stroke="#3E424E"/>

    <!-- Cylinder Base -->
    <ellipse cx="150" cy="360" rx="130" ry="36" fill="#121316" stroke="#2D3038"/>

    <!-- Upper Bevel Trim -->
    <ellipse cx="150" cy="110" rx="130" ry="40" fill="#252730" stroke="#484C5A"/>

    <!-- TOP CONTROL SURFACE (Crucial for 05.jpg rule: 保留顶面操控信息) -->
    <!-- Glowing LED Ring -->
    <ellipse cx="150" cy="100" rx="118" ry="34" fill="none" stroke="url(#aromaRingGlow)" stroke-width="4.5"/>

    <!-- Inner Matte Touch Surface -->
    <ellipse cx="150" cy="98" rx="110" ry="30" fill="#16171B" stroke="#2B2D36" stroke-width="1.5"/>

    <!-- Central Scent Jet Vent -->
    <ellipse cx="150" cy="98" rx="28" ry="10" fill="#090A0D" stroke="#00F0FF" stroke-width="1.5"/>
    <ellipse cx="150" cy="98" rx="12" ry="4" fill="#000000"/>

    <!-- Touch Icons & Indicators on Top Surface -->
    <!-- Mode Touch Icon -->
    <circle cx="105" cy="98" r="7" fill="#20222A" stroke="#717584" stroke-width="1"/>
    <text x="105" y="101" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="8">M</text>

    <!-- Power Touch Icon -->
    <circle cx="195" cy="98" r="7" fill="#20222A" stroke="#717584" stroke-width="1"/>
    <text x="195" y="101" text-anchor="middle" fill="#00F0FF" font-family="sans-serif" font-size="8">⏻</text>

    <!-- Front Logo on Machine Body -->
    <text x="150" y="240" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="4">TURTLE</text>
    <text x="150" y="265" text-anchor="middle" fill="#00F0FF" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">AROMA AI</text>
    <line x1="80" y1="285" x2="220" y2="285" stroke="#3A3E4B"/>
    <text x="150" y="305" text-anchor="middle" fill="#9CA3AF" font-family="monospace" font-size="10">INTELLIGENT START · STOP</text>
  </g>

  <!-- ================= 3. ESSENTIAL OIL BOTTLE (FRONT RIGHT) ================= -->
  <g transform="translate(700, 520)">
    <!-- Dropper Cap -->
    <rect x="42" y="10" width="36" height="40" rx="3" fill="#1C1D22" stroke="#383A44"/>
    <ellipse cx="60" cy="10" rx="18" ry="8" fill="#2C2E37"/>
    <rect x="36" y="45" width="48" height="14" rx="2" fill="#D97706" stroke="#92400E"/>

    <!-- Amber Glass Bottle Body -->
    <path d="M20,90 C20,70 40,60 60,60 C80,60 100,70 100,90 L100,270 C100,285 90,290 60,290 C30,290 20,285 20,270 Z" fill="#78350F" stroke="#92400E" stroke-width="1.5"/>

    <!-- Label on Oil Bottle -->
    <g transform="translate(24, 110)">
      <rect width="72" height="130" rx="2" fill="#121316" stroke="#2A2C34"/>
      <rect x="0" y="10" width="72" height="4" fill="#00F0FF"/>
      <text x="36" y="40" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="900">COLOGNE</text>
      <text x="36" y="55" text-anchor="middle" fill="#00F0FF" font-family="sans-serif" font-size="7" font-weight="700">PURE ESSENCE</text>
      <text x="36" y="90" text-anchor="middle" fill="#D1D5DB" font-family="monospace" font-size="8">10 mL</text>
    </g>
  </g>
</svg>
