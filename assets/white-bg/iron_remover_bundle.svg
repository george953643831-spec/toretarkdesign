<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background -->
    <rect id="bg2" width="1000" height="1000" fill="#FFFFFF"/>

    <!-- Contact Ground Shadows -->
    <radialGradient id="occlusionShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#1A1A1D" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#3A3C44" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softGroundShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121214" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#2A2B30" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottle Gradients -->
    <linearGradient id="bottleBodyGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="12%" stop-color="#22242A"/>
      <stop offset="28%" stop-color="#555864"/>
      <stop offset="36%" stop-color="#9EA4B5"/>
      <stop offset="44%" stop-color="#3D404A"/>
      <stop offset="70%" stop-color="#151619"/>
      <stop offset="92%" stop-color="#3A3E48"/>
      <stop offset="100%" stop-color="#18191D"/>
    </linearGradient>

    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <linearGradient id="bottleLabelGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090A0C"/>
      <stop offset="20%" stop-color="#181A20"/>
      <stop offset="36%" stop-color="#2D3039"/>
      <stop offset="50%" stop-color="#16171B"/>
      <stop offset="85%" stop-color="#24262E"/>
      <stop offset="100%" stop-color="#0D0E11"/>
    </linearGradient>

    <linearGradient id="boxFrontGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151619"/>
      <stop offset="50%" stop-color="#222328"/>
      <stop offset="100%" stop-color="#1A1B1F"/>
    </linearGradient>
    <linearGradient id="boxSideGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0B0D"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="boxTopGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3C44"/>
      <stop offset="100%" stop-color="#22242B"/>
    </linearGradient>
  </defs>

  <!-- Pure White Background -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- ================= GROUND SHADOWS ================= -->
  <ellipse cx="690" cy="840" rx="160" ry="32" fill="url(#softGroundShadow2)"/>
  <ellipse cx="680" cy="845" rx="110" ry="14" fill="url(#occlusionShadow2)"/>

  <ellipse cx="460" cy="855" rx="150" ry="34" fill="url(#softGroundShadow2)"/>
  <ellipse cx="460" cy="858" rx="95" ry="15" fill="url(#occlusionShadow2)"/>

  <ellipse cx="260" cy="860" rx="90" ry="20" fill="url(#softGroundShadow2)"/>
  <ellipse cx="260" cy="862" rx="55" ry="10" fill="url(#occlusionShadow2)"/>

  <!-- ================= 1. PACKAGING BOX (RIGHT REAR) ================= -->
  <g id="packagingBox2" transform="translate(560, 310)">
    <polygon points="90,0 230,25 150,65 10,40" fill="url(#boxTopGrad2)" stroke="#4A4D57" stroke-width="1"/>
    <polygon points="10,40 150,65 150,530 10,505" fill="url(#boxFrontGrad2)"/>
    <polygon points="150,65 230,25 230,490 150,530" fill="url(#boxSideGrad2)"/>

    <!-- Red Top Bar -->
    <polygon points="10,80 150,105 150,120 10,95" fill="url(#redAccentGrad)"/>
    <text x="25" y="150" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="3" transform="skewY(9.8)">PRO CHEMICAL</text>
    <text x="25" y="210" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="2" transform="skewY(9.8)">IRON</text>
    <text x="25" y="245" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="2" transform="skewY(9.8)">REMOVER</text>
    <text x="25" y="290" fill="#A0A5B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1" transform="skewY(9.8)">COLOR-ACTIVATING DECON</text>
    <text x="25" y="320" fill="#717582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1" transform="skewY(9.8)">PH NEUTRAL FORMULA · 16 FL OZ</text>
  </g>

  <!-- ================= 2. MAIN SPRAY BOTTLE (CENTER) ================= -->
  <g id="mainBottle2" transform="translate(350, 160)">
    <!-- Trigger Sprayer -->
    <g id="sprayer2" transform="translate(30, 0)">
      <path d="M40,55 L8,55 L4,72 L40,70 Z" fill="#25262B" stroke="#444752" stroke-width="1"/>
      <ellipse cx="6" cy="63" rx="3" ry="8" fill="#151619" stroke="#EF4444" stroke-width="1"/>
      <path d="M38,42 C38,42 65,30 115,30 C165,30 185,48 185,75 C185,100 160,118 135,120 L135,138 L85,138 L85,116 C65,116 48,102 42,88 Z" fill="#1C1D22" stroke="#383B44" stroke-width="1"/>
      <path d="M52,90 C50,110 58,150 78,175 C82,180 88,175 85,168 C72,145 68,115 68,90 Z" fill="#2B2D35" stroke="#4B4E5A" stroke-width="1"/>
      <rect x="75" y="138" width="70" height="24" rx="3" fill="#2A2C34" stroke="#454854" stroke-width="1"/>
    </g>

    <!-- Bottle Neck -->
    <path d="M102,162 L118,162 C118,185 125,205 145,218 L168,235 C190,250 205,275 205,305 L205,685 C205,695 195,700 185,700 L35,700 C25,700 15,695 15,685 L15,305 C15,275 30,250 52,235 L75,218 C95,205 102,185 102,162 Z" fill="url(#bottleBodyGrad2)" stroke="#383B45" stroke-width="1.2"/>

    <!-- Highlight Strip -->
    <path d="M72,255 L72,690" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Label -->
    <g id="bottleLabel2" transform="translate(18, 320)">
      <rect width="184" height="320" rx="4" fill="url(#bottleLabelGrad2)" stroke="#2D303A" stroke-width="1"/>
      <rect x="0" y="18" width="184" height="8" fill="url(#redAccentGrad)"/>

      <g transform="translate(92, 60)" text-anchor="middle">
        <circle cx="0" cy="0" r="18" fill="#181A20" stroke="#EF4444" stroke-width="1.5"/>
        <text y="6" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900">T</text>
        <text y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="3">TURTLE</text>
      </g>

      <text x="92" y="145" text-anchor="middle" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" letter-spacing="2">IRON</text>
      <text x="92" y="175" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" letter-spacing="2">REMOVER</text>

      <rect x="22" y="198" width="140" height="20" rx="3" fill="#1E2027" stroke="#363945" stroke-width="0.8"/>
      <text x="92" y="212" text-anchor="middle" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">COLOR CHANGING PURPLE</text>

      <text x="92" y="245" text-anchor="middle" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">DISSOLVES BRAKE DUST</text>
      <text x="92" y="262" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="500">SAFE ON CLEAR COATS &amp; WHEELS</text>

      <line x1="25" y1="282" x2="159" y2="282" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6"/>
      <text x="92" y="302" text-anchor="middle" fill="#E5E7EB" font-family="monospace" font-size="10" font-weight="700">16 FL. OZ. (473 mL)</text>
    </g>
  </g>

  <!-- ================= 3. DETAILING BRUSH (LEFT/FRONT) ================= -->
  <g id="detailingBrush" transform="translate(230, 480)">
    <!-- Handle -->
    <rect x="24" y="0" width="14" height="250" rx="7" fill="#1E2025" stroke="#3A3D46" stroke-width="1"/>
    <!-- Red Accent Collar Band -->
    <rect x="22" y="240" width="18" height="12" rx="2" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>
    <!-- Ferrule -->
    <path d="M18,252 L44,252 L48,300 L14,300 Z" fill="#2A2C34" stroke="#454854" stroke-width="1"/>
    <!-- Bristles -->
    <path d="M14,300 L48,300 C52,360 48,380 38,385 C24,385 20,360 14,300 Z" fill="#121316" stroke="#2B2D35" stroke-width="1"/>
    <!-- Bristle Soft Hair Lines -->
    <line x1="22" y1="310" x2="22" y2="375" stroke="#3A3C46" stroke-width="1"/>
    <line x1="28" y1="310" x2="28" y2="380" stroke="#4A4C56" stroke-width="1"/>
    <line x1="34" y1="310" x2="34" y2="380" stroke="#3A3C46" stroke-width="1"/>
    <line x1="40" y1="310" x2="40" y2="375" stroke="#2E303A" stroke-width="1"/>
  </g>
</svg>
