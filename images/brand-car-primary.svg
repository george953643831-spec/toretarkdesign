<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600">
  <defs>
    <!-- Background Studio Gradients -->
    <radialGradient id="studioBackdrop" cx="60%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#222226" />
      <stop offset="45%" stop-color="#141416" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>

    <linearGradient id="bodyPaintMain" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFBE1A" />
      <stop offset="25%" stop-color="#FFB600" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="hoodSheen" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="35%" stop-color="#FFCE4A" />
      <stop offset="65%" stop-color="#FFEBB0" />
      <stop offset="85%" stop-color="#FFBA1A" />
      <stop offset="100%" stop-color="#E08300" />
    </linearGradient>

    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#FFF4D0" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#FFB600" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFB600" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="doorSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="30%" stop-color="#FFBE1A" />
      <stop offset="70%" stop-color="#FFB600" />
      <stop offset="100%" stop-color="#EA8C00" />
    </linearGradient>

    <linearGradient id="fenderHighlight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="20%" stop-color="#FFC833" />
      <stop offset="60%" stop-color="#FFB600" />
      <stop offset="100%" stop-color="#C26A00" />
    </linearGradient>

    <linearGradient id="mirrorPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2E" />
      <stop offset="40%" stop-color="#1B1B1E" />
      <stop offset="80%" stop-color="#0E0E10" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <linearGradient id="metalHinge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD666" />
      <stop offset="40%" stop-color="#FFB600" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="tireRubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232326" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#080809" />
    </linearGradient>

    <linearGradient id="rimAlloy" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#4B4B52" />
      <stop offset="50%" stop-color="#2B2B30" />
      <stop offset="100%" stop-color="#18181A" />
    </linearGradient>

    <radialGradient id="badgeMetal" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A1A1AA" />
      <stop offset="45%" stop-color="#52525B" />
      <stop offset="80%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Background Studio Atmosphere -->
  <rect width="1600" height="1600" fill="url(#studioBackdrop)" />

  <!-- Soft Studio Overhead Lighting Spill -->
  <ellipse cx="1050" cy="300" rx="700" ry="400" fill="#FFE8A3" opacity="0.04" />
  <ellipse cx="600" cy="800" rx="600" ry="500" fill="#FFB600" opacity="0.03" />

  <!-- 2. Front Left Tire & Rugged All-Terrain Wheel (Bottom Left) -->
  <g id="tire_and_wheel">
    <!-- Outer Tire Rim & Black Silhouette -->
    <path d="M 0,980 Q 200,980 340,1150 Q 420,1260 410,1480 L 360,1600 L 0,1600 Z" fill="#0A0A0C" />
    
    <!-- Tire Shoulder with Chunky All-Terrain Tread Lugs -->
    <path d="M 10,1020 Q 180,1030 300,1180 Q 370,1280 360,1480 L 320,1600 L 0,1600 Z" fill="url(#tireRubber)" stroke="#1F1F23" stroke-width="6" />

    <!-- Tread Grooves / Lug Patterns -->
    <g stroke="#09090B" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M 80,1050 L 130,1080 M 140,1090 L 190,1130 M 200,1140 L 250,1190" />
      <path d="M 240,1210 L 290,1270 M 270,1290 L 320,1360 M 290,1380 L 340,1460" />
      <path d="M 290,1480 L 330,1560 M 70,1110 L 120,1150 M 130,1170 L 180,1220" />
      <path d="M 170,1240 L 220,1310 M 200,1330 L 240,1420 M 210,1440 L 250,1540" />
    </g>

    <!-- Alloy Wheel Rim Ring -->
    <ellipse cx="140" cy="1440" rx="200" ry="200" fill="url(#rimAlloy)" stroke="#3F3F46" stroke-width="8" />
    <ellipse cx="140" cy="1440" rx="140" ry="140" fill="#121214" stroke="#27272A" stroke-width="6" />

    <!-- Wheel Spokes (Jeep Rubicon Style Dark Gunmetal Spokes) -->
    <g stroke="#3F3F46" stroke-width="22" stroke-linecap="round">
      <line x1="140" y1="1440" x2="260" y2="1350" />
      <line x1="140" y1="1440" x2="300" y2="1480" />
      <line x1="140" y1="1440" x2="210" y2="1600" />
      <line x1="140" y1="1440" x2="60" y2="1590" />
      <line x1="140" y1="1440" x2="20" y2="1370" />
      <line x1="140" y1="1440" x2="100" y2="1280" />
    </g>

    <!-- Center Hub & Lug Nuts -->
    <circle cx="140" cy="1440" r="45" fill="#18181B" stroke="#52525B" stroke-width="5" />
    <circle cx="140" cy="1440" r="16" fill="#71717A" />
    <g fill="#A1A1AA">
      <circle cx="115" cy="1420" r="7" />
      <circle cx="165" cy="1420" r="7" />
      <circle cx="165" cy="1465" r="7" />
      <circle cx="115" cy="1465" r="7" />
      <circle cx="140" cy="1410" r="7" />
    </g>
  </g>

  <!-- 3. Jeep Front Fender Black Underside & Fender Flare -->
  <g id="fender_and_flare">
    <!-- Fender Inner Well Black Trim -->
    <path d="M 10,950 L 370,950 Q 400,950 400,1050 L 400,1220 Q 380,1400 330,1550 L 10,1550 Z" fill="#0C0C0E" />

    <!-- Fender Flare Black Rubber Inner Edge (Matte Black Trim) -->
    <path d="M 20,950 Q 40,780 40,700 Q 50,560 270,510 L 400,500 L 400,560 Q 220,590 190,720 Q 180,820 220,940 Q 360,940 500,1180 Q 550,1280 540,1480 L 490,1480 Q 500,1300 450,1200 Q 320,980 200,970 L 20,970 Z" fill="#18181B" stroke="#27272A" stroke-width="4" filter="url(#subtleShadow)" />

    <!-- Amber Front Marker Reflector on Fender Edge -->
    <path d="M 28,840 L 48,844 L 44,910 L 25,906 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2" />
    <path d="M 32,850 L 42,852 L 39,895 L 30,892 Z" fill="#F97316" />

    <!-- Broad Amber Yellow Front Fender Flare Main Surface -->
    <path d="M 35,680 Q 60,530 300,480 L 400,465 Q 520,465 600,475 Q 670,485 700,540 L 760,670 Q 770,720 740,780 L 590,1380 Q 570,1460 530,1480 L 510,1480 Q 550,1320 530,1200 Q 410,930 240,890 Q 160,860 160,740 Q 160,640 100,660 Z" fill="url(#fenderHighlight)" stroke="#D97706" stroke-width="2" filter="url(#softShadow)" />

    <!-- Fender Curved Surface Highlight Beam -->
    <path d="M 120,620 Q 240,540 400,520 Q 540,520 640,560 L 580,950 Q 450,860 300,820 Z" fill="url(#specularGlow)" opacity="0.6" />

    <!-- Fender Top Ridge Specular Streak -->
    <path d="M 80,640 Q 180,525 350,490 Q 480,480 620,490" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <path d="M 620,490 Q 680,510 710,570 L 755,670" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 4. Main Vehicle Body: Cowl, Hood, Door Panel -->
  <g id="body_panels">
    <!-- Body Panel Base (Vibrant Amber Yellow #FFB600) -->
    <path d="M 280,470 Q 500,340 760,250 Q 860,220 980,240 L 1050,40 L 1600,40 L 1600,1600 L 530,1600 L 740,780 L 700,540 Q 670,485 600,475 Z" fill="url(#bodyPaintMain)" />

    <!-- Hood Slope (Top Left to Center) -->
    <path d="M 370,450 Q 600,320 830,235 L 940,245 L 820,480 Q 660,520 450,560 Z" fill="url(#hoodSheen)" />

    <!-- Hood Leading Edge Specular Line -->
    <path d="M 390,440 Q 610,315 820,235" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <path d="M 400,455 Q 615,330 810,250" fill="none" stroke="#FFF7D6" stroke-width="14" stroke-linecap="round" opacity="0.4" />

    <!-- Hood-to-Cowl Seam & Panel Gap -->
    <path d="M 825,235 L 945,245 L 815,500 L 800,495 Z" fill="#451A03" opacity="0.85" />
    <line x1="825" y1="235" x2="800" y2="495" stroke="#180C02" stroke-width="4" />

    <!-- Cowl Panel between Hood and Windshield -->
    <path d="M 825,235 Q 920,225 980,240 L 1030,360 L 960,560 L 800,495 Z" fill="url(#bodyPaintMain)" />

    <!-- Cowl Black Air Vent Grille / Fender Heat Extractor Vent -->
    <g id="cowl_vent" transform="translate(640, 465) rotate(-3)">
      <!-- Black Recessed Pocket -->
      <path d="M 20,10 Q 50,5 65,15 L 75,90 Q 65,160 40,175 Q 25,170 20,150 L 12,50 Z" fill="#0C0C0E" stroke="#1C1917" stroke-width="4" filter="url(#subtleShadow)" />
      <!-- Honeycomb / Slat Grille Lines -->
      <g stroke="#27272A" stroke-width="3" stroke-linecap="round">
        <line x1="22" y1="35" x2="65" y2="35" />
        <line x1="20" y1="60" x2="70" y2="60" />
        <line x1="18" y1="85" x2="73" y2="85" />
        <line x1="20" y1="110" x2="68" y2="110" />
        <line x1="24" y1="135" x2="55" y2="135" />
        <line x1="28" y1="155" x2="44" y2="155" />
      </g>
      <!-- Vent Rim Chrome/Gleam Highlight -->
      <path d="M 12,45 L 20,10 Q 50,5 65,15 L 75,70" fill="none" stroke="#FFD666" stroke-width="3" opacity="0.8" />
    </g>

    <!-- A-Pillar Base & Windshield Frame (Top) -->
    <path d="M 980,240 L 1050,40 L 1200,40 L 1150,230 Z" fill="url(#doorSheen)" />
    <!-- Windshield Weatherstrip Rubber -->
    <line x1="1050" y1="40" x2="1150" y2="230" stroke="#09090B" stroke-width="12" stroke-linecap="round" />

    <!-- A-Pillar Side Mirror Bracket (Black Textured Polycarbonate) -->
    <g id="side_mirror_mount">
      <path d="M 770,0 L 1080,0 L 1080,180 Q 1040,250 960,240 Q 880,230 840,150 Z" fill="url(#mirrorPlastic)" stroke="#09090B" stroke-width="5" filter="url(#softShadow)" />
      <!-- Mirror Stalk Arm & Joint -->
      <path d="M 910,140 Q 940,240 1010,235 Q 1050,230 1060,180 L 1020,130 Z" fill="#1C1917" stroke="#292524" stroke-width="3" />
      <!-- Mirror Glass Housing Bevel -->
      <path d="M 800,0 L 1040,0 L 1040,140 Q 980,160 880,140 Z" fill="#26262B" />
      <!-- Highlight Reflection on Mirror Top Edge -->
      <line x1="840" y1="10" x2="1030" y2="10" stroke="#52525B" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Front Door Panel (Right Half) -->
    <path d="M 960,370 L 1600,280 L 1600,1600 L 960,1600 Z" fill="url(#doorSheen)" />

    <!-- Door Vertical Shut Line (Between Cowl/Fender and Front Door) -->
    <path d="M 960,250 L 960,1600" stroke="#291504" stroke-width="8" />
    <path d="M 956,250 L 956,1600" stroke="#FFD666" stroke-width="2" opacity="0.6" />
    <path d="M 964,250 L 964,1600" stroke="#120800" stroke-width="4" opacity="0.9" />

    <!-- Door Lower Rocker Panel Seam Line -->
    <path d="M 700,1490 L 1600,1440" stroke="#451A03" stroke-width="8" />
    <path d="M 700,1486 L 1600,1436" stroke="#FFE082" stroke-width="2" opacity="0.7" />
    <path d="M 700,1496 L 1600,1446 L 1600,1600 L 650,1600 Z" fill="#E68A00" />

    <!-- Large Softbox Reflection Across Upper Door & Fender -->
    <path d="M 820,380 Q 1100,320 1600,300 L 1600,820 Q 1200,840 850,780 Z" fill="url(#specularGlow)" opacity="0.4" />
  </g>

  <!-- 5. Signature Jeep Mechanical Details: Hinges, Badge, Handle -->
  <!-- Trail Rated 4x4 Round Emblem Badge -->
  <g id="trail_rated_badge" transform="translate(865, 430)">
    <!-- Drop Shadow & Outer Bezel -->
    <circle cx="28" cy="28" r="32" fill="#0A0A0C" filter="url(#subtleShadow)" />
    <circle cx="28" cy="28" r="28" fill="url(#badgeMetal)" stroke="#71717A" stroke-width="3" />
    <circle cx="28" cy="28" r="24" fill="#27272A" stroke="#3F3F46" stroke-width="2" />
    <!-- Embossed Graphic Details in Badge -->
    <circle cx="28" cy="28" r="18" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="4,2" />
    <!-- Mountain/Vehicle Emboss Symbol -->
    <path d="M 18,34 L 24,24 L 30,30 L 38,18 L 42,34 Z" fill="#71717A" />
    <!-- Badge Specular Flash -->
    <path d="M 16,16 Q 24,8 36,12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Upper Heavy-Duty Door Hinge (Yellow Body-Color with Industrial Hardware) -->
  <g id="upper_hinge" transform="translate(930, 365)" filter="url(#softShadow)">
    <!-- Base Plate on Cowl Side -->
    <path d="M 0,15 L 28,10 Q 35,10 38,20 L 42,100 Q 38,110 28,110 L 0,105 Z" fill="url(#metalHinge)" stroke="#78350F" stroke-width="3" />
    <!-- Door-Mounted Moving Arm Hinge Block -->
    <path d="M 32,5 Q 40,0 55,5 L 105,15 Q 120,20 125,35 L 130,85 Q 125,100 110,105 L 55,115 Q 40,120 32,110 Z" fill="url(#metalHinge)" stroke="#78350F" stroke-width="3.5" />
    <!-- Center Hinge Pivot Cylinder -->
    <rect x="25" y="10" width="22" height="100" rx="6" fill="#F59E0B" stroke="#451A03" stroke-width="3" />
    <!-- Beveled Facets on Hinge Arm -->
    <path d="M 45,25 L 105,32 Q 112,35 114,45 L 116,75 Q 112,85 105,88 L 45,95 Z" fill="#FFC833" stroke="#B45309" stroke-width="2" />
    <!-- Top & Bottom Hinge Torx Bolts (Dark Gunmetal with Specular Highlights) -->
    <circle cx="85" cy="45" r="11" fill="#1C1917" stroke="#44403C" stroke-width="3" />
    <circle cx="85" cy="45" r="5" fill="#A8A29E" />
    <circle cx="85" cy="75" r="11" fill="#1C1917" stroke="#44403C" stroke-width="3" />
    <circle cx="85" cy="75" r="5" fill="#A8A29E" />
    <!-- Top Specular Highlight on Hinge Edge -->
    <path d="M 38,8 L 110,18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Lower Heavy-Duty Door Hinge (Yellow Body-Color) -->
  <g id="lower_hinge" transform="translate(930, 700)" filter="url(#softShadow)">
    <!-- Base Plate on Cowl Side -->
    <path d="M 0,15 L 28,10 Q 35,10 38,20 L 42,100 Q 38,110 28,110 L 0,105 Z" fill="url(#metalHinge)" stroke="#78350F" stroke-width="3" />
    <!-- Door-Mounted Moving Arm Hinge Block -->
    <path d="M 32,5 Q 40,0 55,5 L 105,15 Q 120,20 125,35 L 130,85 Q 125,100 110,105 L 55,115 Q 40,120 32,110 Z" fill="url(#metalHinge)" stroke="#78350F" stroke-width="3.5" />
    <!-- Center Hinge Pivot Cylinder -->
    <rect x="25" y="10" width="22" height="100" rx="6" fill="#F59E0B" stroke="#451A03" stroke-width="3" />
    <!-- Beveled Facets on Hinge Arm -->
    <path d="M 45,25 L 105,32 Q 112,35 114,45 L 116,75 Q 112,85 105,88 L 45,95 Z" fill="#FFC833" stroke="#B45309" stroke-width="2" />
    <!-- Bolts -->
    <circle cx="85" cy="45" r="11" fill="#1C1917" stroke="#44403C" stroke-width="3" />
    <circle cx="85" cy="45" r="5" fill="#A8A29E" />
    <circle cx="85" cy="75" r="11" fill="#1C1917" stroke="#44403C" stroke-width="3" />
    <circle cx="85" cy="75" r="5" fill="#A8A29E" />
    <!-- Specular Highlight -->
    <path d="M 38,8 L 110,18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Door Handle (Rugged Black Textured Paddle Handle with Keyhole) -->
  <g id="door_handle" transform="translate(1330, 310)" filter="url(#softShadow)">
    <!-- Handle Outer Grip Assembly (Black Matte Composite) -->
    <path d="M 0,35 Q 20,20 60,15 L 230,10 Q 260,15 270,35 L 260,85 Q 245,100 210,100 L 50,105 Q 15,100 0,80 Z" fill="url(#mirrorPlastic)" stroke="#09090B" stroke-width="5" />
    <!-- Handle Grip Recess / Pocket -->
    <path d="M 25,30 L 225,25 Q 240,30 245,45 L 240,75 Q 230,85 210,85 L 35,90 Q 20,85 18,70 Z" fill="#09090B" />
    <!-- Handle Pull Trigger / Grip Bar -->
    <path d="M 20,40 L 205,36 Q 220,40 225,50 L 220,70 Q 215,76 200,76 L 25,80 Q 15,76 15,65 Z" fill="#1C1917" stroke="#27272A" stroke-width="2" />
    <!-- Button / Keyless Entry Sensor Square -->
    <rect x="175" y="48" width="18" height="18" rx="4" fill="#27272A" stroke="#3F3F46" stroke-width="1.5" />
    <!-- Handle Top Specular Highlight -->
    <path d="M 40,22 L 230,17" fill="none" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Door Keyhole Cylinder (Separate Hardware Below Handle on Wrangler) -->
  <g id="door_keyhole" transform="translate(1545, 415)">
    <ellipse cx="20" cy="25" rx="18" ry="24" fill="#1C1917" stroke="#44403C" stroke-width="3" filter="url(#subtleShadow)" />
    <ellipse cx="20" cy="25" rx="12" ry="17" fill="#292524" stroke="#09090B" stroke-width="2" />
    <!-- Key Slot -->
    <line x1="20" y1="16" x2="20" y2="34" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="20" cy="20" r="4" fill="#000000" />
    <path d="M 10,14 Q 18,6 26,10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 6. Studio Lighting Vignette & Contrast Overlay -->
  <!-- Top Dark Gradient Vignette for Studio Depth -->
  <rect width="1600" height="350" fill="url(#studioBackdrop)" opacity="0.25" />
  <!-- Left Side Studio Falloff -->
  <rect width="300" height="1600" fill="#000000" opacity="0.3" />
</svg>
