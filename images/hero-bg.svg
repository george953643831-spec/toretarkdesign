<svg viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky & Atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    
    <!-- Sea & Coast -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    
    <!-- Mountain Haze -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <!-- Patio Stone Ground -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716C" />
      <stop offset="30%" stop-color="#57534E" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Wet Ground Sheen -->
    <linearGradient id="wetReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.9" />
    </linearGradient>

    <!-- Yellow Jeep Body Gradient -->
    <linearGradient id="jeepYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <linearGradient id="jeepYellowHood" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Foam & Suds Gradient -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>

    <!-- Water Spray Beam -->
    <linearGradient id="waterSpray" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FEF3C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Sky & Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />
  <rect width="1600" height="900" fill="url(#sunGlow)" />

  <!-- Distant Ocean Line -->
  <rect x="0" y="360" width="600" height="90" fill="url(#seaGrad)" opacity="0.8" />
  <path d="M0,380 Q150,370 300,385 T600,375 L600,450 L0,450 Z" fill="url(#mountainGrad)" opacity="0.6" />

  <!-- Villa Wall on the Right -->
  <rect x="1320" y="0" width="280" height="600" fill="#F5F5F4" opacity="0.9" />
  <rect x="1300" y="30" width="300" height="40" fill="#E7E5E4" />
  <rect x="1350" y="80" width="250" height="400" fill="#1C1917" opacity="0.8" />

  <!-- Palm Tree silhouette in background -->
  <path d="M1200,320 Q1220,250 1200,180 Q1230,170 1270,180 M1210,210 Q1250,190 1290,220 M1200,230 Q1240,240 1280,260" stroke="#166534" stroke-width="4" fill="none" opacity="0.5" />

  <!-- 2. Patio Stone Terrace Ground -->
  <polygon points="0,440 1600,440 1600,900 0,900" fill="url(#groundGrad)" />
  <polygon points="0,440 1600,440 1600,900 0,900" fill="url(#wetReflect)" />

  <!-- Ground Stone Flagstone Tiles Lines -->
  <g stroke="#44403C" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="520" x2="1600" y2="520" />
    <line x1="0" y1="620" x2="1600" y2="620" />
    <line x1="0" y1="740" x2="1600" y2="740" />
    <line x1="200" y1="440" x2="100" y2="900" />
    <line x1="500" y1="440" x2="400" y2="900" />
    <line x1="800" y1="440" x2="750" y2="900" />
    <line x1="1100" y1="440" x2="1150" y2="900" />
    <line x1="1400" y1="440" x2="1500" y2="900" />
  </g>

  <!-- Wet Ground Soap Suds Splatters -->
  <g fill="url(#foamGrad)">
    <ellipse cx="680" cy="780" rx="260" ry="40" opacity="0.7" />
    <ellipse cx="400" cy="720" rx="140" ry="25" opacity="0.6" />
    <ellipse cx="980" cy="740" rx="180" ry="30" opacity="0.7" />
    <ellipse cx="1200" cy="710" rx="100" ry="20" opacity="0.5" />
    <ellipse cx="300" cy="650" rx="80" ry="15" opacity="0.5" />
    <circle cx="580" cy="760" r="18" opacity="0.8" />
    <circle cx="760" cy="800" r="22" opacity="0.8" />
    <circle cx="890" cy="770" r="16" opacity="0.8" />
  </g>

  <!-- 3. MAIN VEHICLE: Yellow Jeep Wrangler (JL) 4-Door -->
  <g id="jeep-vehicle" transform="translate(100, 20)">
    <!-- Vehicle Shadow on ground -->
    <ellipse cx="680" cy="680" rx="460" ry="45" fill="#0C0A09" opacity="0.7" />

    <!-- Wheels & Tires -->
    <!-- Rear Wheel Left (in view) -->
    <g transform="translate(290, 480)">
      <circle cx="65" cy="65" r="68" fill="#18181B" stroke="#27272A" stroke-width="8" />
      <circle cx="65" cy="65" r="48" fill="#27272A" />
      <!-- Silver rim spokes -->
      <circle cx="65" cy="65" r="32" fill="#71717A" stroke="#E4E4E7" stroke-width="4" />
      <circle cx="65" cy="65" r="12" fill="#18181B" />
      <!-- Suds on wheel -->
      <path d="M20,50 Q40,30 70,35 Q100,40 110,65 Q95,95 65,95 Z" fill="url(#foamGrad)" opacity="0.75" />
    </g>

    <!-- Front Wheel Center (Being Scrubbed) -->
    <g transform="translate(680, 470)">
      <circle cx="85" cy="85" r="88" fill="#09090B" stroke="#18181B" stroke-width="12" />
      <!-- Rugged all-terrain tire treads -->
      <circle cx="85" cy="85" r="76" fill="#18181B" stroke="#27272A" stroke-dasharray="14 10" stroke-width="8" />
      <!-- Alloy Wheel -->
      <circle cx="85" cy="85" r="54" fill="#3F3F46" stroke="#D4D4D8" stroke-width="6" />
      <polygon points="85,35 95,75 125,75 100,95 110,125 85,105 60,125 70,95 45,75 75,75" fill="#A1A1AA" />
      <circle cx="85" cy="85" r="16" fill="#18181B" stroke="#EAB308" stroke-width="2" />
      <!-- Thick foam lather over wheel -->
      <path d="M30,70 Q50,30 95,35 Q140,40 150,85 Q135,135 85,145 Q45,135 30,70 Z" fill="url(#foamGrad)" opacity="0.85" />
    </g>

    <!-- Front Passenger Wheel (far side) -->
    <g transform="translate(1010, 485)">
      <circle cx="55" cy="55" r="58" fill="#18181B" stroke="#27272A" stroke-width="6" />
      <circle cx="55" cy="55" r="38" fill="#3F3F46" />
      <circle cx="55" cy="55" r="10" fill="#09090B" />
    </g>

    <!-- Jeep Black Rugged Front Bumper -->
    <rect x="730" y="500" width="370" height="42" rx="10" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <circle cx="810" cy="520" r="14" fill="#FEF08A" stroke="#3F3F46" stroke-width="3" opacity="0.9" />
    <circle cx="1030" cy="520" r="14" fill="#FEF08A" stroke="#3F3F46" stroke-width="3" opacity="0.9" />
    <rect x="850" y="512" width="140" height="20" rx="4" fill="#09090B" />

    <!-- Yellow Jeep Body Main Tub -->
    <!-- Rear Cabin & Quarter Panel -->
    <path d="M260,250 L560,240 L600,320 L580,480 L280,480 Z" fill="url(#jeepYellow)" />
    <!-- Black Hardtop & Tinted Windows -->
    <path d="M270,140 L530,130 L550,240 L260,250 Z" fill="#18181B" />
    <rect x="290" y="155" width="105" height="75" rx="6" fill="#27272A" stroke="#09090B" stroke-width="3" />
    <rect x="410" y="150" width="105" height="80" rx="6" fill="#27272A" stroke="#09090B" stroke-width="3" />
    <!-- Rear Fender Flare -->
    <path d="M260,400 Q360,360 440,430 L430,480 L260,480 Z" fill="#18181B" />

    <!-- Front Cabin, Doors & Windshield -->
    <path d="M530,130 L760,150 L770,320 L570,320 Z" fill="#18181B" />
    <!-- Upright Wrangler Windshield -->
    <polygon points="560,145 740,165 720,290 565,280" fill="#38BDF8" opacity="0.75" stroke="#18181B" stroke-width="6" />
    <!-- Windshield Foam Suds dripping down -->
    <path d="M570,155 Q640,175 730,175 L720,220 Q660,200 575,200 Z" fill="url(#foamGrad)" opacity="0.65" />

    <!-- Front Fender Flare (Black) -->
    <path d="M630,420 Q750,330 890,380 L880,460 Q760,410 650,460 Z" fill="#18181B" />

    <!-- Front Hood (Vibrant Yellow with reflections) -->
    <polygon points="680,280 1020,310 1010,400 640,360" fill="url(#jeepYellowHood)" stroke="#CA8A04" stroke-width="1.5" />

    <!-- Jeep Iconic 7-Slot Grille & Round Headlights -->
    <g transform="translate(860, 340)">
      <!-- Grille Face -->
      <polygon points="0,20 220,35 210,130 0,115" fill="url(#jeepYellow)" />
      <!-- Iconic 7 Vertical Slots -->
      <g fill="#09090B" stroke="#18181B" stroke-width="1">
        <rect x="45" y="45" width="11" height="55" rx="5" />
        <rect x="65" y="47" width="11" height="55" rx="5" />
        <rect x="85" y="49" width="11" height="55" rx="5" />
        <rect x="105" y="51" width="11" height="55" rx="5" />
        <rect x="125" y="53" width="11" height="55" rx="5" />
        <rect x="145" y="55" width="11" height="55" rx="5" />
        <rect x="165" y="57" width="11" height="55" rx="5" />
      </g>
      <!-- Left Round Headlight with LED Halo Ring -->
      <circle cx="22" cy="70" r="22" fill="#FEF08A" stroke="#FFFFFF" stroke-width="4" opacity="0.95" />
      <circle cx="22" cy="70" r="14" fill="#FDE047" />
      <!-- Right Round Headlight with LED Halo Ring -->
      <circle cx="195" cy="85" r="20" fill="#FEF08A" stroke="#FFFFFF" stroke-width="4" opacity="0.95" />
      <circle cx="195" cy="85" r="12" fill="#FDE047" />
    </g>

    <!-- Rich Layer of Car Wash White Foam running down Body & Hood -->
    <g fill="url(#foamGrad)" opacity="0.88">
      <!-- Side Body Foam streams -->
      <path d="M280,270 Q320,260 360,285 Q390,320 370,390 Q340,430 310,410 Q280,360 280,270 Z" />
      <path d="M420,260 Q480,255 520,290 Q540,360 500,420 Q450,400 420,260 Z" />
      <path d="M540,310 Q620,300 660,330 Q680,410 630,450 Q580,430 540,310 Z" />
      <!-- Hood Thick Snow Foam Blanket -->
      <path d="M700,295 Q820,310 970,325 Q960,380 910,395 Q810,380 730,370 Q690,340 700,295 Z" />
      <path d="M750,330 Q840,340 920,350 Q900,380 830,375 Z" fill="#FFFFFF" />
      <!-- Dripping foam drips -->
      <path d="M330,410 C335,440 345,460 340,470 C335,460 325,440 330,410 Z" />
      <path d="M470,420 C475,455 485,475 480,485 C475,475 465,455 470,420 Z" />
      <path d="M630,450 C635,475 645,490 640,498 C635,490 625,475 630,450 Z" />
      <path d="M830,375 C835,410 840,430 838,440 C832,430 828,410 830,375 Z" />
      <path d="M920,350 C925,385 930,405 928,415 C922,405 918,385 920,350 Z" />
    </g>
  </g>

  <!-- 4. FOUR DETAILING WORKERS (MATCHING THE UPLOADED SCENE) -->

  <!-- Worker 1 (Far Left, wiping rear quarter panel) -->
  <g id="worker-left" transform="translate(320, 260)">
    <!-- Body in grey uniform -->
    <ellipse cx="60" cy="190" rx="35" ry="65" fill="#3F3F46" />
    <path d="M40,240 L35,360 L50,440 L65,440 L55,360 L65,240 Z" fill="#27272A" />
    <path d="M65,240 L75,360 L85,440 L100,440 L85,360 L75,240 Z" fill="#27272A" />
    <!-- Black work boots -->
    <rect x="40" y="440" width="30" height="20" rx="4" fill="#09090B" />
    <rect x="80" y="440" width="30" height="20" rx="4" fill="#09090B" />
    <!-- Arms & yellow detailing towel -->
    <path d="M70,160 Q100,180 130,210" stroke="#3F3F46" stroke-width="20" stroke-linecap="round" fill="none" />
    <!-- Yellow Microfiber Towel -->
    <path d="M125,200 Q150,195 160,225 Q145,245 125,235 Z" fill="#FACC15" stroke="#EAB308" stroke-width="2" />
    <!-- Head & Cap -->
    <circle cx="65" cy="115" r="22" fill="#78350F" opacity="0.85" />
    <path d="M45,110 Q65,95 85,110 L92,112 Z" fill="#18181B" />
  </g>

  <!-- Worker 2 (Center-Front Kneeling, scrubbing front wheel with yellow cloth) -->
  <g id="worker-kneeling" transform="translate(620, 410)">
    <!-- Kneeling/Squatting legs -->
    <path d="M40,110 Q50,180 30,240 L10,280 L40,285 L60,230 Q70,170 60,110 Z" fill="#27272A" />
    <path d="M70,110 Q110,160 130,230 L160,270 L135,280 L105,220 Q85,160 70,110 Z" fill="#27272A" />
    <!-- Black waterproof work boots on wet ground -->
    <polygon points="5,275 45,275 40,290 0,290" fill="#09090B" />
    <polygon points="135,270 170,270 165,285 130,285" fill="#09090B" />
    <!-- Torso bent forward in charcoal grey workshirt -->
    <ellipse cx="80" cy="90" rx="38" ry="48" fill="#3F3F46" />
    <!-- Head & beard profile -->
    <circle cx="95" cy="35" r="20" fill="#78350F" opacity="0.85" />
    <circle cx="98" cy="40" r="12" fill="#27272A" opacity="0.6" />
    <!-- Extended Arms & Black Nitrile Gloves scrubbing wheel -->
    <path d="M65,80 Q105,110 145,120" stroke="#3F3F46" stroke-width="18" stroke-linecap="round" fill="none" />
    <circle cx="150" cy="120" r="10" fill="#18181B" />
    <!-- Bright Yellow Microfiber Wheel Detailing Towel -->
    <path d="M140,105 Q175,100 185,135 Q165,160 135,145 Q130,120 140,105 Z" fill="#FACC15" stroke="#EAB308" stroke-width="2" />
  </g>

  <!-- Worker 3 (Center behind Hood, detailing the hood) -->
  <g id="worker-hood" transform="translate(860, 200)">
    <ellipse cx="40" cy="80" rx="28" ry="45" fill="#3F3F46" />
    <circle cx="42" cy="25" r="18" fill="#78350F" opacity="0.85" />
    <!-- Arms reaching over yellow hood -->
    <path d="M30,60 Q10,100 -20,110" stroke="#3F3F46" stroke-width="16" stroke-linecap="round" fill="none" />
  </g>

  <!-- Worker 4 (Right Standing, spraying high pressure water onto hood) -->
  <g id="worker-sprayer" transform="translate(1180, 210)">
    <!-- Torso in grey uniform -->
    <ellipse cx="60" cy="180" rx="35" ry="68" fill="#3F3F46" />
    <!-- Trousers & Boots -->
    <rect x="40" y="235" width="22" height="200" fill="#27272A" />
    <rect x="68" y="235" width="22" height="200" fill="#27272A" />
    <rect x="36" y="425" width="30" height="20" rx="4" fill="#09090B" />
    <rect x="66" y="425" width="30" height="20" rx="4" fill="#09090B" />
    <!-- Head & Beard -->
    <circle cx="58" cy="100" r="22" fill="#78350F" opacity="0.85" />
    <circle cx="62" cy="106" r="13" fill="#27272A" opacity="0.5" />
    <!-- Arms holding Pressure Washer Wand -->
    <path d="M50,150 L10,180 L-50,160" stroke="#3F3F46" stroke-width="16" stroke-linecap="round" fill="none" />
    <!-- Black Spray Gun & High-Pressure Wand -->
    <line x1="-50" y1="160" x2="-140" y2="150" stroke="#09090B" stroke-width="8" stroke-linecap="round" />
    <line x1="-140" y1="150" x2="-220" y2="140" stroke="#71717A" stroke-width="5" />
    <!-- Pressure hose curling down to ground -->
    <path d="M-50,170 Q-30,280 -10,380 Q0,440 20,440" stroke="#09090B" stroke-width="6" fill="none" />
  </g>

  <!-- 5. Dynamic Water Spray Beam & Splashing Droplets -->
  <g id="water-spray-beam">
    <!-- Concentrated high-pressure fan spray -->
    <polygon points="960,350 1140,255 1145,265" fill="url(#waterSpray)" />
    <!-- Fine mist cloud around vehicle front -->
    <ellipse cx="940" cy="360" rx="90" ry="40" fill="#E0F2FE" opacity="0.45" />
    <ellipse cx="970" cy="380" rx="120" ry="50" fill="#BAE6FD" opacity="0.35" />
    <!-- Water Splashes & Droplets -->
    <g fill="#FFFFFF" opacity="0.85">
      <circle cx="930" cy="330" r="3" />
      <circle cx="910" cy="350" r="4" />
      <circle cx="950" cy="320" r="2" />
      <circle cx="890" cy="370" r="5" />
      <circle cx="880" cy="340" r="3" />
      <circle cx="970" cy="340" r="3" />
      <circle cx="1020" cy="370" r="4" />
      <circle cx="860" cy="390" r="3" />
      <circle cx="940" cy="410" r="4" />
    </g>
  </g>

  <!-- 6. Detailing Product Bottles & Wash Bucket on Patio (Right Side) -->
  <g id="bottles" transform="translate(1380, 620)">
    <!-- Yellow Wash Bucket with Grit Guard & Suds -->
    <ellipse cx="60" cy="110" rx="35" ry="12" fill="#09090B" opacity="0.5" />
    <polygon points="30,50 90,50 82,110 38,110" fill="#EAB308" stroke="#CA8A04" stroke-width="2" />
    <ellipse cx="60" cy="50" rx="30" ry="8" fill="#FFFFFF" opacity="0.9" />
    <!-- Black Detailing Spray Bottles (TORETARK) -->
    <rect x="95" y="60" width="16" height="50" rx="3" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <rect x="98" y="75" width="10" height="25" rx="1" fill="#FFB600" />
    <path d="M103,50 L103,60 M98,54 L108,54" stroke="#18181B" stroke-width="3" />

    <rect x="115" y="55" width="18" height="55" rx="3" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <rect x="118" y="70" width="12" height="30" rx="1" fill="#FFB600" />
    <path d="M124,45 L124,55 M119,49 L129,49" stroke="#18181B" stroke-width="3" />
  </g>
</svg>
